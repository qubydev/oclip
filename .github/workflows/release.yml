name: Release Windows installer

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Check release version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match package.json version 'v$version'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check Electron renderer and preload
        run: npm run test:smoke

      - name: Build Windows x64 installer
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub Release with installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "dist/oclip-Setup-$version-x64.exe"
          if (!(Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not produced: $installer"
          }
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME, $installer,
            '--verify-tag', '--generate-notes', '--draft',
            '--title', "Oclip $env:GITHUB_REF_NAME"
          )
          if ($version.Contains('-')) {
            $releaseArgs += '--prerelease'
          }
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release and upload the installer.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Installer uploaded, but the release could not be published. Check the draft release.' }
